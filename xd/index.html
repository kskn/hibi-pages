<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>hibi</title>
</head>
<body>
<noscript>
  <a href="https://apps.apple.com/jp/app/id6799611736?ct=bmtx_x&amp;mt=8">App Store で見る</a> /
  <a href="https://play.google.com/store/apps/details?id=jp.bmtx.hibi&amp;utm_source=bmtx_x&amp;utm_campaign=x_dev">Google Play で見る</a>
</noscript>
<script>
  // 端末に応じてストアへ即時振り分け（開発アカ用・計測コード bmtx_x）。表示要素なし
  (function () {
    var ua = navigator.userAgent || "";
    // iPadOS は Mac の UA を名乗ることがあるため、タッチ点数で判定を補う
    var isIOS = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
    var isAndroid = /Android/.test(ua);
    if (isIOS) {
      location.replace("https://apps.apple.com/jp/app/id6799611736?ct=bmtx_x&mt=8");
    } else if (isAndroid) {
      location.replace("https://play.google.com/store/apps/details?id=jp.bmtx.hibi&utm_source=bmtx_x&utm_campaign=x_dev");
    } else {
      // ストアアプリのない環境（PC 等）は LP へ
      location.replace("https://hibi.bmtx.jp/");
    }
  })();
</script>
</body>
</html>
